    <text x="24" y="188" font-family="Arial" font-size="14" fill="#475569">Multidimensional data cube with a</text><text x="24" y="210" font-family="Arial" font-size="14" fill="#475569">forward Q-tail. Structured and technical.</text>
  </g>

