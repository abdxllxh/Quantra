version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: datalens-db
    environment:
      POSTGRES_USER: datalens
      POSTGRES_PASSWORD: datalens_secret_password_2026
      POSTGRES_DB: datalens_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalens -d datalens_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datalens-backend
    environment:
      DATABASE_URL: postgresql://datalens:datalens_secret_password_2026@postgres:5432/datalens_ai
      JWT_SECRET: datalens-ai-super-secret-key-development-mode-2026
      MAX_UPLOAD_SIZE_MB: 100
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datalens-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
